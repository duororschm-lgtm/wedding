<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>verify-harness</title>
</head>
<body>
<iframe id="f" style="width:360px;height:900px;border:0"></iframe>
<pre id="report">REPORT\nPENDING</pre>
<script>
  var W = parseInt(location.search.match(/w=(\d+)/)[1], 10) || 360;
  document.getElementById('f').style.width = W + 'px';
  try { sessionStorage.setItem('wedding-opened', '1'); } catch (e) {}
  var rep = document.getElementById('report');
  var f = document.getElementById('f');
  f.src = '../index.html';
  f.addEventListener('load', function () { setTimeout(run, 10000); });

  function run() {
    var out = [];
    try {
      var w = f.contentWindow, d = f.contentDocument;
      var vw = w.innerWidth;
      out.push('vw=' + vw);
      out.push('bodyOverflow=' + (d.body.scrollWidth - vw));

      var hero = d.getElementById('hero');
      out.push('heroH=' + hero.offsetHeight);
      var title = d.querySelector('.game-title');
      if (title) {
        var tcs = w.getComputedStyle(title);
        out.push('gameTitle=' + tcs.fontFamily.split(',')[0] + '/' + tcs.fontSize + '/' + tcs.color);
      }
      out.push('heroCn=' + (d.querySelector('.hero-cn') || {}).textContent);
      out.push('heroDate=' + (d.querySelector('.hero-date') || {}).textContent);
      out.push('eyebrow=' + (d.getElementById('hero-save') || {}).textContent);
      out.push('stars=' + d.querySelectorAll('#hero-scene .sky-stars i').length);
      var hills = d.querySelector('#hero-scene .hills');
      if (hills) { var hcs = w.getComputedStyle(hills); out.push('hills=' + hcs.height + '/bottom=' + hcs.bottom); }
      var scBtn = d.getElementById('hero-scroll-btn');
      if (scBtn) { var r = scBtn.getBoundingClientRect(); out.push('scrollBtn=' + (r.width | 0) + 'x' + (r.height | 0)); }
      var moon = w.getComputedStyle(hero, '::after');
      out.push('moon=' + moon.width + '/' + moon.height + '/' + moon.backgroundColor);

      Array.prototype.forEach.call(d.querySelectorAll('.section'), function (s) {
        if (s.scrollWidth - s.clientWidth > 1) {
          out.push('overflow:' + (s.id || s.className.split(' ')[0]) + '=' + (s.scrollWidth - s.clientWidth));
        }
      });

      var fox = d.querySelector('.notice-deco img');
      out.push('fox=' + (fox && fox.naturalWidth ? 'ok' : 'FAIL'));
      out.push('flowers=' + d.querySelectorAll('#notice-flowers svg').length);

      var st = d.querySelector('.sec-title');
      if (st) {
        var before = w.getComputedStyle(st, '::before');
        out.push('secTitleBefore=' + before.content + '/size=' + before.fontSize + '/color=' + before.color);
      }

      out.push('portraitCells=' + d.querySelectorAll('.portrait-cell').length);
      var miss = [];
      Array.prototype.forEach.call(d.querySelectorAll('.portrait-cell img'), function (im) {
        if (!im.complete || im.naturalWidth === 0) miss.push(im.src.split('/').pop());
      });
      out.push('portraitMiss=' + (miss.length ? miss.join(',') : 'none'));

      var pc = d.querySelector('#gallery-grid .photo-card img');
      if (pc) out.push('firstPhoto=' + pc.src.split('/').pop() + (pc.naturalWidth ? ':ok' : ':FAIL'));
      else out.push('firstPhoto=missing-card');

      var lc = d.querySelector('#map .location-card');
      out.push('locationCard=' + (lc ? 'ok' : 'FAIL'));
      if (lc) {
        var imgs = lc.querySelectorAll('img');
        var miss2 = [];
        Array.prototype.forEach.call(imgs, function (im) {
          if (!im.complete || im.naturalWidth === 0) miss2.push(im.src.split('/').pop());
        });
        out.push('transportImgs=' + imgs.length + ':' + (miss2.length ? 'FAIL ' + miss2.join(',') : 'ok'));
        out.push('overline=' + (lc.querySelector('.location-overline') || {}).textContent);
        out.push('venue=' + (lc.querySelector('#map-venue') || {}).textContent);
        out.push('publicText=' + (lc.querySelector('#transport-public') || {}).textContent);
        out.push('carText=' + (lc.querySelector('#transport-car-text') || {}).textContent);
        var mb = lc.querySelector('#map-btn');
        out.push('mapBtn=' + (mb ? mb.textContent + ':' + (mb.classList.contains('pixel-button') ? 'pixel' : 'NOPIXEL') + ':' + (mb.href.indexOf('uri.amap.com') >= 0 ? 'amap' : 'NOAMAP') : 'FAIL'));
        out.push('copyBtn=' + ((lc.querySelector('#copy-addr-btn') || {}).textContent || 'FAIL'));
        out.push('icsBtn=' + ((lc.querySelector('#ics-btn') || {}).textContent || 'FAIL'));
      }

      if (lc) {
        d.body.classList.add('night');
        var ncs = w.getComputedStyle(lc);
        var ncell = w.getComputedStyle(lc.querySelector('.transport-cell'));
        out.push('nightCard=' + ncs.backgroundColor + '/' + ncs.borderColor);
        out.push('nightCell=' + ncell.backgroundColor + '/' + ncell.borderColor);
      }

      var wide = [];
      Array.prototype.forEach.call(d.querySelectorAll('body *'), function (el) {
        var r = el.getBoundingClientRect();
        if (r.width > vw + 2 && r.width < 3000) {
          var tag = (el.className && typeof el.className === 'string' && el.className.split(' ')[0]) || el.tagName;
          if (wide.length < 14) wide.push(tag + ':' + (r.width | 0));
        }
      });
      out.push('wideElements=' + (wide.join(' ') || 'none'));

      /* ===== 轮播/网格/灯箱/宾客墙检测（虚拟时间快进） ===== */
      function snapSlides() {
        var on = d.querySelector('#ceremony-slides .slide.on');
        var src = on ? on.src.split('/').pop() : 'none';
        var layers = d.querySelectorAll('#ceremony-slides .slide').length;
        return 'layers=' + layers + '|on=' + src;
      }
      out.push('boardHidden=' + d.getElementById('ceremony-board').hidden);
      out.push('gridHidden=' + d.getElementById('gallery-grid').hidden);
      out.push('headingHidden=' + d.querySelector('.gallery-heading').hidden);
      out.push('dots=' + d.querySelectorAll('#ceremony-dots .dot').length);
      out.push('slides0=' + snapSlides());
      out.push('wallEmpty=' + (d.querySelector('#animal-grid .wall-empty') ? 'yes' : 'no'));
      out.push('portraitCells=' + d.querySelectorAll('.portrait-cell').length);
      out.push('giftCells=' + d.querySelectorAll('#gift-row .gift-cell').length);
      var tt = d.getElementById('treasure-total');
      out.push('treasureHearts=' + d.querySelectorAll('.treasure-heart').length + '/' + (tt ? tt.textContent : '?'));
      out.push('photoCards=' + d.querySelectorAll('#gallery-grid .photo-card').length);
      out.push('viewBtn=' + (d.getElementById('gallery-view-btn') || {}).textContent);

      /* 滚到婚礼节，等一张切换（离屏时轮播会暂停，滚动后应恢复） */
      var board = d.getElementById('ceremony-board');
      var sec = d.getElementById('ceremony');
      try { board.scrollIntoView({ block: 'center' }); } catch (e) { w.scrollTo(0, 10000); }
      setTimeout(function () {
        out.push('boardTop=' + (board.getBoundingClientRect().top | 0));
        var paused = sec.classList.contains('animations-paused');
        out.push('pausedClass=' + paused);
        /* 无头虚拟时间下 IO 不重算，手动模拟 on-intersect 回调 */
        if (paused) { sec.classList.remove('animations-paused'); out.push('pausedCleared=manual'); }
        setTimeout(function () {
          var a = snapSlides();
          setTimeout(function () {
            var b = snapSlides();
            out.push('slidesAdvance=' + (a !== b ? 'moved(' + a.split('|')[1] + '->' + b.split('|')[1] + ')' : 'STUCK'));
            /* 暂停路径：加回 class 应停，移除后应恢复 */
            sec.classList.add('animations-paused');
            var p1 = snapSlides();
            setTimeout(function () {
              var p2 = snapSlides();
              out.push('pauseHold=' + (p1 !== p2 ? 'ADVANCED(FAIL)' : 'STUCK(ok)'));
              sec.classList.remove('animations-paused');
              setTimeout(function () {
                var p3 = snapSlides();
                out.push('pauseResume=' + (p2 !== p3 ? 'moved(ok)' : 'STUCK(FAIL)'));
                /* 切到网格视图 */
                d.getElementById('gallery-view-btn').click();
                out.push('gridView_boardHidden=' + d.getElementById('ceremony-board').hidden);
                out.push('gridView_gridHidden=' + d.getElementById('gallery-grid').hidden);
                out.push('gridView_btn=' + d.getElementById('gallery-view-btn').textContent);
                /* 灯箱：点第一张 → 翻页 → 关闭 */
                var card = d.querySelector('#gallery-grid .photo-card');
                card.click();
                setTimeout(function () {
                  out.push('lb_open=' + !d.getElementById('lightbox').hidden);
                  out.push('lb_counter=' + d.getElementById('lb-counter').textContent);
                  d.getElementById('lb-next').click();
                  out.push('lb_next=' + d.getElementById('lb-counter').textContent);
                  d.getElementById('lb-close').click();
                  setTimeout(function () {
                    out.push('lb_closed=' + d.getElementById('lightbox').hidden);
                    rep.textContent = 'REPORT\n' + out.join('\n');
                  }, 600);
                }, 600);
              }, 6000);
            }, 5000);
          }, 5500);
        }, 1200);
      }, 1200);
    } catch (e) {
      rep.textContent = 'REPORT\nERROR ' + (e && e.message);
    }
  }
</script>
</body>
</html>
