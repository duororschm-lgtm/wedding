# 婚礼请柬站点 nginx 配置
# 用法：上传到服务器 /etc/nginx/sites-available/wedding
#       sudo ln -s /etc/nginx/sites-available/wedding /etc/nginx/sites-enabled/wedding
#       sudo nginx -t && sudo systemctl reload nginx
# 先把下面 server_name 换成你的域名

server {
    listen 80;
    listen [::]:80;
    server_name 你的域名 www.你的域名;   # ← 改成你的域名

    root /var/www/wedding;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # 照片镜像上传接口（编辑器上传照片时同步到本服务器，后端 127.0.0.1:8790）
    location = /api/upload {
        proxy_pass http://127.0.0.1:8790;
        client_max_body_size 60m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 图片/字体长缓存（.jfif 无内置类型，fallback 为 image/jpeg）
    location ~* \.(png|jpe?g|jfif|gif|webp|svg|woff2?|ttf|mp3|mp4|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        default_type image/jpeg;
    }

    # 页面/JS/数据不缓存，更新即时生效
    location ~* \.(html|js|css|json|txt)$ {
        add_header Cache-Control "no-cache";
    }
}

# ===== HTTPS（装好 certbot 后执行下面一行，会自动改这个文件并加 443）=====
# sudo certbot --nginx -d 你的域名 -d www.你的域名
